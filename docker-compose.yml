services:
  # 1. Gateway - Nginx Reverse Proxy (Entrypoint on port 80)
  gateway:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    container_name: crm_gateway
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks:
      - crm_network

  # 2. Backend - Laravel 11 Core (PHP 8.3 with pdo_pgsql, redis, opcache)
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: crm_backend
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      APP_NAME: "Native CRM"
      APP_ENV: local
      APP_KEY: "base64:OL/s4P0gBHf8a/R7uLOSEfq7EGUM+M6XW6aXC2IiKLg="
      APP_DEBUG: "true"
      APP_URL: "http://localhost"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: crm_database
      DB_USERNAME: crm_user
      DB_PASSWORD: crm_secret_password
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crm_network

  # 3. Database - PostgreSQL 16 (JSONB & GIN Indexes)
  postgres:
    image: postgres:16-alpine
    container_name: crm_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: crm_database
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_secret_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_database"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crm_network

  # 4. Cache & Queues - Redis 7
  redis:
    image: redis:7-alpine
    container_name: crm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crm_network

  # 5. Frontend - Vue 3 + Vite SPA Dev Server
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: crm_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - crm_network

networks:
  crm_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
